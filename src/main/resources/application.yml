spring:
  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:db/changelog/master.xml
  servlet:
    multipart:
      max-file-size: 10MB
  profiles:
    active: dev

server:
  servlet:
    session:
      cookie:
        max-age: 259200
      timeout: 43200

  tomcat:
    relaxed-path-chars: ["|", "{", "}", "^", "`", "[", "]", "\\"]
    relaxed-query-chars: ["|", "{", "}", "^", "`", "[", "]", "\\"]
