<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" xmlns="http://www.w3.org/1999/html">
<head>
  <title>Zarządzanie użytkownikami</title>
</head>
<body>
<main class="main-content" layout:fragment="content">
  <div th:replace="~{fragments/admin-panel-categories :: categories}"></div>

  <p class="notification" th:if="${notification}" th:text="${notification}">
    Belka z powiadomieniami
  </p>

  <h2 class="list-heading">Wyszukaj użytkownika po mailu lub nicku</h2>
  <form class="form-users" action="#" th:action="@{/admin/szukaj-uzytkownika}">
    <input type="text" name="userFind" placeholder="nick / email">
    <button type="submit">Szukaj</button>
  </form>

  <div th:if="${users}">
  <h4 class="list-heading" th:text="${users.isEmpty()? 'Brak wyszukanych użytkowników' : 'Wyszukani użytkownicy'}">
    Wyszukani użytkownicy</h4>
      <ul class="users-list">
          <li th:each="user : ${users}">
              <div class="user-info">
                  <p th:text="|Nick: ${user.nick}|">Nick</p>
                  <p th:text="|Email: ${user.email}|">Email</p>
                  <p th:text="|Last log: ${user.lastLoginDate == null ? 'brak' : #temporals.format(user.lastLoginDate, 'dd-MM-yyyy HH:mm')}|"
                     class="user-dates">Ostatnie logowanie</p>
                  <p th:text="|Last activ: ${user.lastActivDate == null ? 'brak' : #temporals.format(user.lastActivDate, 'dd-MM-yyyy HH:mm')}|"
                     class="user-dates">Ostatnia aktywność</p>
              </div>
              <div class="buttons">
                  <a th:href="@{|/admin/uzytkownik/${user.id}|}" class="edit">Edytuj</a>
                  <a th:href="@{|/admin/usun-uzytkownika/${user.id}|}" class="delete"
                     onclick="return confirm('Czy na pewno chcesz usunąć ?')">Usuń</a>
              </div>
          </li>
      </ul>
  </div>


</main>
</body>
</html>
